{% extends "base.html" %}

{% block title %}FisicaFlow{% endblock %}

{% block content %}
<h1>FisicaFlow</h1>

{% if current_user.is_authenticated %}
  <p>Bem-vindo(a) de volta, {{ current_user.name }}!</p>
{% else %}
  <p>Estude Física com a gente. <a href="{{ url_for('login') }}">Entre</a> ou
     <a href="{{ url_for('cadastrar_student') }}">cadastre-se</a> para começar.</p>
{% endif %}
{% endblock %}
