<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1050" viewBox="0 0 820 1050">
<rect width="820" height="1050" fill="#4b007d"/>
<rect x="38" y="28" width="109" height="74" rx="8" fill="#ee2d87"/>
<text x="52" y="52" fill="white" font-family="Arial" font-size="15" font-weight="bold">CIÊNCIA</text><text x="50" y="79" fill="white" font-family="Arial" font-size="24" font-weight="bold">DELAS</text><text x="55" y="96" fill="white" font-family="Arial" font-size="12" font-weight="bold">23ª SNTC</text>
<text x="190" y="54" fill="white" font-family="Arial" font-size="28" font-weight="bold">FÍSICAFLOW</text><text x="190" y="78" fill="white" font-family="Arial" font-size="16">Aprender Física explorando fenômenos</text>
<text x="190" y="98" fill="white" font-family="Arial" font-size="11">Débora Alice de Oliveira Santos · Maria Helen Moreno de Araújo</text><text x="190" y="115" fill="white" font-family="Arial" font-size="9">Joanny Câmara Maranhão · Orientadores: Bruna Raissa Gomes dos Santos Batista, Leo Moreira Silva e Adorilson Bezerra</text>
<rect x="38" y="133" width="744" height="817" rx="28" fill="white"/><rect x="58" y="151" width="704" height="45" rx="12" fill="#efe6f8"/><text x="75" y="180" fill="#4b007d" font-family="Arial" font-size="18" font-weight="bold">UMA PLATAFORMA DIGITAL COM SIMULADORES INTERATIVOS</text>
<text x="62" y="240" fill="#4b007d" font-family="Arial" font-size="16" font-weight="bold">INTRODUÇÃO</text><text x="62" y="267" fill="#29233a" font-family="Arial" font-size="12"><tspan x="62">Muitos estudantes têm dificuldade em ligar</tspan><tspan x="62" dy="19">conceitos de Física ao cotidiano. O FísicaFlow</tspan><tspan x="62" dy="19">oferece simulações e materiais de apoio.</tspan></text>
<text x="420" y="240" fill="#4b007d" font-family="Arial" font-size="16" font-weight="bold">OBJETIVO</text><text x="420" y="267" fill="#29233a" font-family="Arial" font-size="12"><tspan x="420">Desenvolver uma plataforma web para apoiar</tspan><tspan x="420" dy="19">o estudo de Física com simuladores, conteúdos</tspan><tspan x="420" dy="19">educacionais e organização dos estudos.</tspan></text>
<path d="M62 300H758" stroke="#ddd5e8" stroke-width="2"/><text x="62" y="338" fill="#4b007d" font-family="Arial" font-size="16" font-weight="bold">COMO FUNCIONA</text>
<g font-family="Arial"><rect x="62" y="347" width="205" height="54" rx="14" fill="#efe6f8"/><circle cx="89" cy="374" r="15" fill="#4b007d"/><text x="85" y="379" fill="white" font-weight="bold" font-size="15">1</text><text x="114" y="379" fill="#29233a" font-weight="bold" font-size="13">Escolha um tema</text>
<rect x="297" y="347" width="205" height="54" rx="14" fill="#efe6f8"/><circle cx="324" cy="374" r="15" fill="#4b007d"/><text x="320" y="379" fill="white" font-weight="bold" font-size="15">2</text><text x="349" y="379" fill="#29233a" font-weight="bold" font-size="13">Altere variáveis</text>
<rect x="532" y="347" width="205" height="54" rx="14" fill="#efe6f8"/><circle cx="559" cy="374" r="15" fill="#4b007d"/><text x="555" y="379" fill="white" font-weight="bold" font-size="15">3</text><text x="584" y="379" fill="#29233a" font-weight="bold" font-size="13">Observe o fenômeno</text></g>
<text x="62" y="440" fill="#4b007d" font-family="Arial" font-size="16" font-weight="bold">EXEMPLOS DE SIMULADORES</text>
<rect x="62" y="450" width="328" height="194" rx="13" fill="#f5f2f8" stroke="#d8cbe6" stroke-width="2"/><rect x="74" y="462" width="304" height="116" rx="8" fill="#e7f4f2"/><path d="M92 555H347" stroke="#777" stroke-width="3"/><rect x="177" y="515" width="90" height="32" rx="9" fill="#6c43a1"/><circle cx="199" cy="555" r="9" fill="#29233a"/><circle cx="247" cy="555" r="9" fill="#29233a"/><text x="76" y="610" fill="#4b007d" font-family="Arial" font-weight="bold" font-size="12">CINEMÁTICA</text><text x="186" y="610" fill="#62606b" font-family="Arial" font-size="11">Movimento de um carro</text>
<rect x="412" y="450" width="328" height="194" rx="13" fill="#f5f2f8" stroke="#d8cbe6" stroke-width="2"/><rect x="424" y="462" width="304" height="116" rx="8" fill="#e7f4f2"/><path d="M502 490V548H642V490H502" fill="none" stroke="#6c43a1" stroke-width="4"/><circle cx="572" cy="512" r="13" fill="#ffd45a" stroke="#d59600" stroke-width="2"/><text x="426" y="610" fill="#4b007d" font-family="Arial" font-weight="bold" font-size="12">ELETRICIDADE</text><text x="536" y="610" fill="#62606b" font-family="Arial" font-size="11">Circuito elétrico</text>
<path d="M62 660H758" stroke="#ddd5e8" stroke-width="2"/><text x="62" y="694" fill="#4b007d" font-family="Arial" font-size="16" font-weight="bold">METODOLOGIA</text><text x="62" y="721" fill="#29233a" font-family="Arial" font-size="12"><tspan x="62">Desenvolvimento de aplicação web com</tspan><tspan x="62" dy="19">simuladores, conteúdos, videoaulas e</tspan><tspan x="62" dy="19">questionários com correção automática.</tspan></text>
<text x="420" y="694" fill="#4b007d" font-family="Arial" font-size="16" font-weight="bold">RESULTADOS</text><text x="420" y="721" fill="#29233a" font-family="Arial" font-size="12"><tspan x="420">A plataforma reúne recursos de estudo e</tspan><tspan x="420" dy="19">simulações de diferentes áreas da Física.</tspan><tspan x="420" dy="19">Inserir dados de avaliação, se houver.</tspan></text>
<rect x="62" y="780" width="696" height="89" rx="13" fill="#efe6f8"/><text x="78" y="805" fill="#4b007d" font-family="Arial" font-weight="bold" font-size="15">CONSIDERAÇÕES FINAIS</text><text x="78" y="832" fill="#29233a" font-family="Arial" font-size="12">O FísicaFlow é um recurso complementar para explorar conceitos de Física de forma visual e interativa.</text><text x="78" y="852" fill="#29233a" font-family="Arial" font-size="12">Próximo passo: avaliar usabilidade e contribuição para a aprendizagem com estudantes.</text>
<text x="62" y="900" fill="#4b007d" font-family="Arial" font-weight="bold" font-size="13">REFERÊNCIAS</text><text x="62" y="925" fill="#62606b" font-family="Arial" font-size="11">Adicionar as principais fontes utilizadas no projeto. · QR code para a plataforma (opcional)</text>
<g fill="white" font-family="Arial" font-size="15" font-weight="bold"><text x="120" y="1002">SNTC</text><text x="265" y="1002">IEEE</text><text x="410" y="1002">CNPq</text><text x="555" y="1002">IF</text></g>
</svg>
